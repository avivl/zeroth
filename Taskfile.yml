# https://taskfile.dev
version: "3"

# Requires Go 1.27 (see go.mod).

vars:
  # Pinned so a clean clone does not float onto incompatible tool versions.
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@v0.8.0
  OAPI_CODEGEN: github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
  GITLEAKS: github.com/zricethezav/gitleaks/v8@v8.21.2
  TS_CLIENT: swagger-typescript-api@13.12.6
  PNPM: corepack pnpm

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  # go run <tool>@ver follows the tool's go.mod; pin the repo toolchain so
  # staticcheck can load packages that require Go 1.27.
  GOTOOLCHAIN: go1.27.0

tasks:
  default:
    desc: Build all Go packages
    cmds:
      - task: build

  build:
    desc: go build ./...
    cmds:
      - go build ./...

  up:
    desc: Start zerothd locally with SQLite and the docker sandbox driver
    env:
      ZEROTH_STORE: sqlite
      ZEROTH_SANDBOX: docker
    cmds:
      - go run ./cmd/zerothd

  test:
    desc: go test -race ./...
    cmds:
      - go test -race ./...

  conformance:
    desc: Run every conformance_test.go across all driver implementations
    vars:
      PACKAGES:
        sh: find . \( -name node_modules -o -name .git \) -prune -o -name conformance_test.go -exec dirname {} \; | sort -u | tr '\n' ' '
    cmds:
      - go test -race {{.PACKAGES}} -run Conformance

  lint:go:
    desc: go vet and staticcheck
    cmds:
      - go vet ./...
      - go run {{.STATICCHECK}} ./...

  lint:
    desc: go vet, staticcheck, plus the web lint
    deps: [lint:go, web:deps]
    cmds:
      - "{{.PNPM}} --dir web run lint"

  generate:
    desc: OpenAPI → Go server stubs + TypeScript client
    cmds:
      - mkdir -p pkg/api/gen/go pkg/api/gen/ts
      - go run {{.OAPI_CODEGEN}} --config pkg/api/oapi-codegen.yaml pkg/api/openapi.yaml
      - "{{.PNPM}} dlx {{.TS_CLIENT}} generate -p pkg/api/openapi.yaml -o pkg/api/gen/ts -n client.ts"

  web:
    desc: Vite dev server for web/
    deps: [web:deps]
    cmds:
      - "{{.PNPM}} --dir web run dev"

  web:test:
    desc: Typecheck and test web/
    deps: [web:deps]
    cmds:
      - "{{.PNPM}} --dir web run test"

  web:build:
    desc: Production build of web/
    deps: [web:deps]
    cmds:
      - "{{.PNPM}} --dir web run build"

  secretscan:
    desc: Secret scanner over the worktree, or added lines in GITLEAKS_DIFF_RANGE
    cmds:
      - |
        set -eu
        if [ -n "${GITLEAKS_DIFF_RANGE:-}" ]; then
          _scan_base=$(printf '%s\n' "${GITLEAKS_DIFF_RANGE}" | awk '{print $1}')
          _scan_head=$(printf '%s\n' "${GITLEAKS_DIFF_RANGE}" | awk '{print $2}')
          _scan_extra=$(printf '%s\n' "${GITLEAKS_DIFF_RANGE}" | awk '{print $3}')
          if [ -z "${_scan_base}" ] || [ -z "${_scan_head}" ] || [ -n "${_scan_extra}" ]; then
            echo "secretscan: GITLEAKS_DIFF_RANGE must be two SHAs, got: ${GITLEAKS_DIFF_RANGE}" >&2
            exit 2
          fi
          added=$(git diff -U0 --diff-filter=ACMR "${_scan_base}" "${_scan_head}" | grep -E '^\+' | grep -vE '^\+\+\+' || true)
          if [ -z "${added}" ]; then
            echo "secretscan: no added lines in ${GITLEAKS_DIFF_RANGE}"
            exit 0
          fi
          printf '%s\n' "${added}" | go run {{.GITLEAKS}} detect --no-banner --redact --exit-code 1 --verbose --pipe
        else
          go run {{.GITLEAKS}} detect --no-banner --redact --exit-code 1 --verbose --source . --no-git
        fi

  secretscan:smoke:
    desc: Fail closed. A known fake GitHub PAT must be a finding
    cmds:
      - |
        set -eu
        tmp=$(mktemp -d)
        trap 'rm -rf "${tmp}"' EXIT
        # Assemble at runtime so this file is not itself a finding.
        printf '%s\n' "ghp""_""0123456789abcdefghijklmnopqrstuvwxyz" > "${tmp}/canary.txt"
        set +e
        go run {{.GITLEAKS}} detect --source "${tmp}" --no-git --no-banner --redact --exit-code 1
        code=$?
        set -e
        if [ "${code}" -eq 0 ]; then
          echo "secretscan:smoke: scanner missed a fake GitHub PAT" >&2
          exit 1
        fi
        if [ "${code}" -ne 1 ]; then
          echo "secretscan:smoke: unexpected exit ${code}" >&2
          exit 1
        fi

  vet:
    desc: go vet ./...
    cmds:
      - go vet ./...

  ci:
    desc: Local stand-in for GitHub CI (lint, race tests, conformance, secretscan, web build)
    cmds:
      - task: lint
      - task: test
      - task: conformance
      - task: secretscan:smoke
      - task: secretscan
      - task: web:build
      - task: build

  web:deps:
    internal: true
    desc: Install the web pnpm workspace
    sources:
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - package.json
      - web/package.json
    generates:
      - web/node_modules/.bin/tsc
    cmds:
      - "{{.PNPM}} install"
