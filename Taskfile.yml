version: "3"

# Requires Go 1.27 (see go.mod).

tasks:
  default:
    desc: Build all Go packages
    cmds:
      - task: build

  build:
    desc: go build ./...
    cmds:
      - go build ./...

  test:
    desc: go test -race ./...
    cmds:
      - go test -race ./...

  vet:
    desc: go vet ./...
    cmds:
      - go vet ./...

  lint:
    desc: go vet ./...
    cmds:
      - task: vet

  ci:
    desc: Local stand-in for CI
    cmds:
      - task: lint
      - task: test
      - task: build
