# https://taskfile.dev
version: "3"

vars:
  # Pinned so a clean clone with Go 1.22 does not float onto toolchains
  # that need a newer compiler.
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@v0.5.1
  OAPI_CODEGEN: github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1
  GITLEAKS: github.com/zricethezav/gitleaks/v8@v8.21.2
  TS_CLIENT: swagger-typescript-api@13.12.6
  PNPM: corepack pnpm

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

tasks:
  default:
    desc: Build all Go packages
    cmds:
      - task: build

  build:
    desc: go build ./...
    cmds:
      - go build ./...

  up:
    desc: Start zerothd locally with SQLite and the docker sandbox driver
    env:
      ZEROTH_STORE: sqlite
      ZEROTH_SANDBOX: docker
    cmds:
      - go run ./cmd/zerothd

  test:
    desc: go test -race ./...
    cmds:
      - go test -race ./...

  conformance:
    desc: Run every conformance_test.go across all driver implementations
    vars:
      PACKAGES:
        sh: find . \( -name node_modules -o -name .git \) -prune -o -name conformance_test.go -exec dirname {} \; | sort -u | tr '\n' ' '
    cmds:
      - go test -race {{.PACKAGES}} -run Conformance

  lint:
    desc: go vet, staticcheck, plus the web lint
    deps: [web:deps]
    cmds:
      - go vet ./...
      - go run {{.STATICCHECK}} ./...
      - "{{.PNPM}} --dir web run lint"

  generate:
    desc: OpenAPI → Go server stubs + TypeScript client
    cmds:
      - mkdir -p pkg/api/gen/go pkg/api/gen/ts
      - go run {{.OAPI_CODEGEN}} --config pkg/api/oapi-codegen.yaml pkg/api/openapi.yaml
      - "{{.PNPM}} dlx {{.TS_CLIENT}} generate -p pkg/api/openapi.yaml -o pkg/api/gen/ts -n client.ts"

  web:
    desc: Vite dev server for web/
    deps: [web:deps]
    cmds:
      - "{{.PNPM}} --dir web run dev"

  secretscan:
    desc: Run the secret scanner over the tree
    cmds:
      - go run {{.GITLEAKS}} detect --source . --no-git

  vet:
    desc: go vet ./...
    cmds:
      - go vet ./...

  ci:
    desc: Local stand-in for CI (vet, test, build)
    cmds:
      - task: vet
      - task: test
      - task: build

  web:deps:
    internal: true
    desc: Install the web pnpm workspace
    sources:
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - package.json
      - web/package.json
    generates:
      - web/node_modules/.bin/tsc
    cmds:
      - "{{.PNPM}} install"
