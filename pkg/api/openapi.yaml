openapi: 3.1.0
info:
  title: Zeroth API
  version: 0.0.0
  description: |
    Local control-plane API for Zeroth. Stage 1 is single-player and binds
    locally at 127.0.0.1:8420 by default (ZEROTH_ADDR or zerothd --addr).
    This spec is the canonical contract; Go stubs and the TypeScript client
    are generated from it, not hand-written.

    A flow that cannot be expressed through this API ships on neither the
    web UI nor the CLI. That is what keeps a later Slack surface from becoming
    a second implementation of everything.

    Plan lifecycle is draft, automatic cross-exam, approve (or request-changes,
    or branch), then apply. Apply is a client operation. Cross-exam is not:
    the daemon runs it after every new draft, including drafts produced by
    request-changes. There is no operator re-run trigger.
  license:
    name: MIT
    identifier: MIT
  contact:
    url: https://github.com/avivl/zeroth
servers:
  - url: http://127.0.0.1:8420
    description: |
      Default zerothd bind. Override with ZEROTH_ADDR or zerothd --addr.
      Stage 1 is loopback only; this is not a remote control plane.
tags:
  - name: health
    description: Daemon liveness. Not a product view.
  - name: runs
    description: Human-supervised agent runs (sessions).
  - name: plans
    description: Plan review. Draft and cross-exam happen inside the daemon. Apply is the client mutation.
  - name: agents
    description: Local agent records. Config changes are signed audited actions.
  - name: approvals
    description: Operator inbox. Decisions happen on the subject resource, not here.
  - name: memory
    description: Store-backed session and agent memory, plus human review of proposals.
  - name: audit
    description: Append-only signed trail. HTTP verify re-checks one Schnorr signature. `zeroth verify` walks the hash chain offline.
  - name: checkpoints
    description: Snapshots of run state. Restore forks a new run; it never rewrites the original.
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness
      operationId: health
      responses:
        "200":
          description: Daemon is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /runs:
    get:
      tags: [runs]
      summary: List runs
      operationId: listRuns
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          description: If set, only runs in this status.
          schema:
            $ref: "#/components/schemas/RunStatus"
        - name: agent_id
          in: query
          description: If set, only runs for this agent.
          schema:
            $ref: "#/components/schemas/AgentID"
      responses:
        "200":
          description: A page of runs, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
    post:
      tags: [runs]
      summary: Start a run
      description: |
        Stage 1 has exactly one sandbox driver (Docker). It is not
        user-selectable and is not a field on this request.
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/runs/{id}":
    get:
      tags: [runs]
      summary: Get a run
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"
  "/runs/{id}/events":
    get:
      tags: [runs]
      summary: Replay recent events, then live tail
      description: |
        The event log is the source of truth for a run, not chat residue.

        Query parameter last selects how many recent events to replay.

        A WebSocket upgrade on this path replays those events, then tails
        live. Each WebSocket message is a JSON RunEvent.

        Without Upgrade, this GET returns the same replay window as JSON so
        the CLI and tests can read the log without a socket.

        OpenAPI codegen does not emit a WebSocket client. The generated
        TypeScript helper is this GET. The web UI uses a hand-written
        wrapper in web/ around the generated RunEvent type. That wrapper
        is not a second contract.
      operationId: getRunEvents
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: last
          in: query
          description: How many recent events to replay before live tail. The daemon defaults this when omitted.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Replay window (HTTP). WebSocket clients receive these events, then a live tail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEventList"
        "404":
          $ref: "#/components/responses/NotFound"
  "/runs/{id}/steer":
    post:
      tags: [runs]
      summary: Steer a run
      description: Inject operator guidance into a live run. Does not skip plan-then-apply.
      operationId: steerRun
      parameters:
        - $ref: "#/components/parameters/RunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SteerRequest"
      responses:
        "200":
          description: Steer accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/runs/{id}/background":
    post:
      tags: [runs]
      summary: Background a run
      description: Keep the run working without a foreground session. The operator can still steer, review plans, and read events.
      operationId: backgroundRun
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Run is backgrounded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/runs/{id}/foreground":
    post:
      tags: [runs]
      summary: Foreground a run
      description: Bring a backgrounded run back to a foreground session. Mirrors POST /runs/{id}/background.
      operationId: foregroundRun
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Run is in the foreground
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/runs/{id}/stop":
    post:
      tags: [runs]
      summary: Stop a run
      description: |
        Graceful cancel. The daemon checkpoints on the way out so the
        run can later resume from that checkpoint via restore (which
        forks a new run). The original run's audit chain is unchanged.
      operationId: stopRun
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Run stopped after a checkpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/runs/{id}/checkpoints":
    post:
      tags: [checkpoints]
      summary: Create an on-demand checkpoint
      description: |
        Operator-requested snapshot of this run. Distinct from the
        automatic checkpoint apply takes before executing.
      operationId: createRunCheckpoint
      parameters:
        - $ref: "#/components/parameters/RunID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckpointRequest"
      responses:
        "201":
          description: Checkpoint created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkpoint"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /plans:
    get:
      tags: [plans]
      summary: List plans
      operationId: listPlans
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: run_id
          in: query
          description: If set, only plans for this run.
          schema:
            $ref: "#/components/schemas/RunID"
        - name: status
          in: query
          description: If set, only plans in this status.
          schema:
            $ref: "#/components/schemas/PlanStatus"
      responses:
        "200":
          description: A page of plans, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanList"
  "/plans/{id}":
    get:
      tags: [plans]
      summary: Get a plan
      operationId: getPlan
      parameters:
        - $ref: "#/components/parameters/PlanID"
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "404":
          $ref: "#/components/responses/NotFound"
  "/plans/{id}/approve":
    post:
      tags: [plans]
      summary: Approve a plan
      description: |
        Human gate on the plan lifecycle. After approve, the plan is
        eligible for POST /plans/{id}/apply. Approve does not itself
        mutate the world.
      operationId: approvePlan
      parameters:
        - $ref: "#/components/parameters/PlanID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
      responses:
        "200":
          description: Plan approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/plans/{id}/request-changes":
    post:
      tags: [plans]
      summary: Request changes on a plan
      description: |
        Operator rejects this draft. The daemon produces a new draft
        and auto-cross-examines it, same as the original. There is no
        manual cross-exam re-run.
      operationId: requestPlanChanges
      parameters:
        - $ref: "#/components/parameters/PlanID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestChangesRequest"
      responses:
        "200":
          description: Changes requested; a new draft will be auto-cross-examined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/plans/{id}/branch":
    post:
      tags: [plans]
      summary: Branch a plan
      description: Create an alternative plan from this one. The original plan is unchanged. The branch is auto-cross-examined as a new draft.
      operationId: branchPlan
      parameters:
        - $ref: "#/components/parameters/PlanID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchPlanRequest"
      responses:
        "201":
          description: Branched plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/plans/{id}/apply":
    post:
      tags: [plans]
      summary: Apply an approved plan
      description: |
        The world-changing step. The daemon rechecks preconditions,
        verifies approval, takes a checkpoint, acquires leases, runs
        secretscan as a non-skippable gate, executes the effects, signs
        an audit record, and releases leases.

        Secret-scan findings are also on the plan resource so the
        operator can see them before calling apply. A non-empty findings
        list fails this call (409). There is no skip.
      operationId: applyPlan
      parameters:
        - $ref: "#/components/parameters/PlanID"
      responses:
        "200":
          description: Plan applied. The body is the updated plan plus the audit entry this apply produced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyPlanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /agents:
    get:
      tags: [agents]
      summary: List agents
      operationId: listAgents
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of agents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
  "/agents/{id}":
    get:
      tags: [agents]
      summary: Get an agent
      operationId: getAgent
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: The agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [agents]
      summary: Patch agent config
      description: |
        Config changes are themselves signed audited actions. The daemon
        records and signs the patch; the client does not send a signature.

        A tier change is an explicit operator action. Stage 1 has no
        auto-promotion. Leases are not set here; they are minted during
        apply. Read current leases at GET /agents/{id}/leases.
      operationId: patchAgent
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPatch"
      responses:
        "200":
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/agents/{id}/leases":
    get:
      tags: [agents]
      summary: List current leases for an agent
      description: |
        Read-only view of leases currently held for this agent. Leases
        are minted automatically during apply, not through this API.
      operationId: listAgentLeases
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: Current leases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseList"
        "404":
          $ref: "#/components/responses/NotFound"
  /approvals:
    get:
      tags: [approvals]
      summary: List approvals
      description: |
        Operator inbox. kind is an open string (same rule as RunEvent.type).
        Decide on the subject resource this item deep-links to, not here.
        Memory proposals are under /memory/proposals.
      operationId: listApprovals
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          description: If set, only approvals in this status.
          schema:
            $ref: "#/components/schemas/ApprovalStatus"
      responses:
        "200":
          description: A page of approvals, oldest pending first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
  /memory:
    get:
      tags: [memory]
      summary: List memory entries
      operationId: listMemory
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/MemoryKind"
        - name: ref_id
          in: query
          description: Run id (session memory) or agent id (agent memory).
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: A page of memory entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryList"
    post:
      tags: [memory]
      summary: Write a memory entry
      description: Operator-authored memory. Agent-proposed memory goes through /memory/proposals.
      operationId: createMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemoryRequest"
      responses:
        "201":
          description: Memory stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /memory/proposals:
    get:
      tags: [memory]
      summary: List memory proposals
      operationId: listMemoryProposals
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MemoryProposalStatus"
      responses:
        "200":
          description: A page of memory proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryProposalList"
  "/memory/proposals/{id}/accept":
    post:
      tags: [memory]
      summary: Accept a memory proposal
      operationId: acceptMemoryProposal
      parameters:
        - $ref: "#/components/parameters/MemoryProposalID"
      responses:
        "200":
          description: Proposal accepted; a memory entry was written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryProposal"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  "/memory/proposals/{id}/reject":
    post:
      tags: [memory]
      summary: Reject a memory proposal
      operationId: rejectMemoryProposal
      parameters:
        - $ref: "#/components/parameters/MemoryProposalID"
      responses:
        "200":
          description: Proposal rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryProposal"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /audit:
    get:
      tags: [audit]
      summary: List audit records
      operationId: listAudit
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: resource_type
          in: query
          schema:
            $ref: "#/components/schemas/AuditResourceType"
        - name: resource_id
          in: query
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: A page of audit records, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
  "/audit/{id}/verify":
    post:
      tags: [audit]
      summary: Verify an audit record
      description: |
        Re-check the record's secp256k1 Schnorr signature (ADR-Z-0007) against
        the append-only key registry. Does not rewrite the log. Offline chain
        verification is `zeroth verify <run-id>` against the SQLite file.
      operationId: verifyAudit
      parameters:
        - $ref: "#/components/parameters/AuditID"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerification"
        "404":
          $ref: "#/components/responses/NotFound"
  /checkpoints:
    get:
      tags: [checkpoints]
      summary: List checkpoints
      operationId: listCheckpoints
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: run_id
          in: query
          schema:
            $ref: "#/components/schemas/RunID"
      responses:
        "200":
          description: A page of checkpoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckpointList"
  "/checkpoints/{id}/restore":
    post:
      tags: [checkpoints]
      summary: Restore a checkpoint
      description: |
        Fork a new run from this checkpoint. The original run is not
        mutated; its audit chain stays immutable. Matches the branch
        model (two futures in parallel). Consequential work in the new
        run still goes through plan-then-apply.
      operationId: restoreCheckpoint
      parameters:
        - $ref: "#/components/parameters/CheckpointID"
      responses:
        "201":
          description: New run forked from the checkpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque page cursor from a previous next_cursor.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      description: Page size. The daemon defaults this when omitted.
      schema:
        type: integer
        minimum: 1
        maximum: 200
    RunID:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RunID"
    PlanID:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PlanID"
    AgentID:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AgentID"
    MemoryProposalID:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MemoryProposalID"
    AuditID:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AuditID"
    CheckpointID:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CheckpointID"
  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Policy denied this action (missing grant, expired lease, or unknown scope).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No resource with that id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource is not in a state that allows this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          description: Machine-readable error code.
        message:
          type: string
          minLength: 1
          description: Human-readable explanation.
    RunID:
      type: string
      minLength: 1
      description: Opaque run id. Not interchangeable with other id kinds.
    PlanID:
      type: string
      minLength: 1
      description: Opaque plan id. Not interchangeable with other id kinds.
    AgentID:
      type: string
      minLength: 1
      description: Opaque agent id. Not interchangeable with other id kinds.
    ApprovalID:
      type: string
      minLength: 1
      description: Opaque approval id. Not interchangeable with other id kinds.
    MemoryID:
      type: string
      minLength: 1
      description: Opaque memory entry id. Not interchangeable with other id kinds.
    MemoryProposalID:
      type: string
      minLength: 1
      description: Opaque memory proposal id. Not interchangeable with other id kinds.
    AuditID:
      type: string
      minLength: 1
      description: Opaque audit record id. Not interchangeable with other id kinds.
    CheckpointID:
      type: string
      minLength: 1
      description: Opaque checkpoint id. Not interchangeable with other id kinds.
    LeaseID:
      type: string
      minLength: 1
      description: Opaque lease id. Not interchangeable with other id kinds.
    GrantID:
      type: string
      minLength: 1
      description: Opaque grant id. Not interchangeable with other id kinds.
    ScopeID:
      type: string
      minLength: 1
      description: Opaque scope id. Not interchangeable with other id kinds.
    RunStatus:
      type: string
      description: Lifecycle of a run. Unknown values must be treated as non-terminal.
      enum:
        - pending
        - running
        - waiting_approval
        - backgrounded
        - stopped
        - completed
        - failed
        - cancelled
    PlanStatus:
      type: string
      description: Plan lifecycle. Apply is POST /plans/{id}/apply after approve.
      enum:
        - draft
        - cross_exam
        - pending_approval
        - approved
        - changes_requested
        - applying
        - applied
        - abandoned
    AgentStatus:
      type: string
      enum:
        - ready
        - busy
        - disabled
    ApprovalStatus:
      type: string
      enum:
        - pending
        - approved
        - changes_requested
    MemoryKind:
      type: string
      enum:
        - session
        - agent
        - operator
    MemoryProposalStatus:
      type: string
      enum:
        - pending
        - accepted
        - rejected
    AuditResourceType:
      type: string
      enum:
        - run
        - plan
        - agent
        - memory
        - checkpoint
        - lease
    PlanEffectType:
      type: string
      enum:
        - create
        - modify
        - destroy
        - memory_proposal
    Run:
      type: object
      additionalProperties: false
      required: [id, agent_id, status, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/RunID"
        agent_id:
          $ref: "#/components/schemas/AgentID"
        plan_id:
          $ref: "#/components/schemas/PlanID"
        status:
          $ref: "#/components/schemas/RunStatus"
        prompt:
          type: string
          description: Operator prompt that started the run, when one was given.
        tracker_ref:
          type: string
          minLength: 1
          description: Optional tracker issue id (for example a Linear issue id). This API does not proxy the tracker.
        workspace_source:
          $ref: "#/components/schemas/WorkspaceSource"
        autonomy_tier:
          type: string
          minLength: 1
          description: Earned autonomy tier for this run. The kernel interprets the value; unknown tiers deny by default.
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
        finished_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
    RunList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        next_cursor:
          type: string
          minLength: 1
          description: Omitted when there is no next page.
    WorkspaceSource:
      type: object
      additionalProperties: false
      required: [repo]
      properties:
        repo:
          type: string
          minLength: 1
          description: Repository URL or local path to check out for the run.
        ref:
          type: string
          minLength: 1
          description: Git ref (branch, tag, or SHA). The daemon default applies when omitted.
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [agent_id]
      properties:
        agent_id:
          $ref: "#/components/schemas/AgentID"
        tracker_ref:
          type: string
          minLength: 1
          description: Optional tracker issue id to attach to the run.
        prompt:
          type: string
          description: Optional operator prompt. Not required to create the run.
        workspace_source:
          $ref: "#/components/schemas/WorkspaceSource"
    SteerRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          description: Operator guidance to inject into the live run.
    RunEvent:
      type: object
      additionalProperties: false
      required: [id, run_id, type, created_at]
      properties:
        id:
          type: string
          minLength: 1
        run_id:
          $ref: "#/components/schemas/RunID"
        type:
          type: string
          minLength: 1
          description: |
            Event kind. Open string; new types will be added and clients
            must tolerate unknowns. Known values: log, tool_call,
            tool_result, plan_drafted, cross_exam_verdict,
            checkpoint_created, effect_applied, status_changed, error.
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
        plan_id:
          $ref: "#/components/schemas/PlanID"
        message:
          type: string
          description: Human-readable summary of the event, when one exists.
    RunEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunEvent"
    Plan:
      type: object
      additionalProperties: false
      required: [id, run_id, status, summary, effects, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/PlanID"
        run_id:
          $ref: "#/components/schemas/RunID"
        parent_plan_id:
          $ref: "#/components/schemas/PlanID"
          description: Set when this plan was created by branch.
        status:
          $ref: "#/components/schemas/PlanStatus"
        summary:
          type: string
          minLength: 1
          description: Human-readable rationale for the plan. Not a substitute for effects.
        hash:
          type: string
          minLength: 1
          description: |
            Canonical digest of the rows and the constraints the plan was
            drafted under. A revised plan is a new hash and needs a new
            approval by construction.
        expires_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC. Apply after this instant is a deny. Expiry is exclusive.
        cost_ceiling:
          type: integer
          format: int64
          minimum: 0
          description: Token ceiling for the plan as a whole. Not a billing field. Zero means unset.
        scope_id:
          $ref: "#/components/schemas/ScopeID"
          description: Scope the plan was drafted under.
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/CredentialConstraint"
          description: Credential classes the plan was drafted under. Never secret values.
        effects:
          type: array
          items:
            $ref: "#/components/schemas/PlanEffect"
          description: Structured diffs the operator reviews before apply.
        cross_exam:
          $ref: "#/components/schemas/CrossExam"
        secret_scan_findings:
          type: array
          items:
            $ref: "#/components/schemas/SecretScanFinding"
          description: |
            Secretscan results. Omitted until the gate has run. Empty
            means it ran and found nothing. Non-empty findings block
            apply; the payload never includes the secret itself.
        review_comment:
          type: string
          description: Latest operator comment from approve or request-changes.
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
    PlanList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
        next_cursor:
          type: string
          minLength: 1
    PlanEffect:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/PlanEffectType"
        path:
          type: string
          minLength: 1
          description: Workspace path this effect touches. For memory_proposal, a memory key.
        diff:
          type: string
          description: Unified diff or proposed content. Never a secret value.
        precondition_hash:
          type: string
          minLength: 1
          description: Hash of the pre-apply state this effect assumes. Apply rechecks it.
        postcondition_hash:
          type: string
          minLength: 1
          description: Hash of the post-apply state this effect promises. Apply rechecks it.
        idempotency_key:
          type: string
          minLength: 1
          description: Stable key so apply retries do not double-apply this row.
        lease_id:
          $ref: "#/components/schemas/LeaseID"
          description: Lease this row will consume on apply.
        cost_estimate:
          type: string
          minLength: 1
          description: Harness-supplied cost hint (tokens, time, or other). Not a billing field.
    CredentialConstraint:
      type: object
      additionalProperties: false
      required: [provider, kind]
      properties:
        provider:
          type: string
          minLength: 1
          description: Credential provider (for example anthropic). Never a secret.
        kind:
          type: string
          minLength: 1
          description: Credential class (for example api_key). Never the secret itself.
    CrossExam:
      type: object
      additionalProperties: false
      required: [verdict, reviewer_model, reasoning, at]
      properties:
        verdict:
          type: string
          minLength: 1
          description: Outcome of the automatic cross-exam. Open string; clients must tolerate unknown verdicts.
        reviewer_model:
          type: string
          minLength: 1
          description: Model that performed the cross-exam.
        reasoning:
          type: string
          minLength: 1
          description: Why the reviewer reached this verdict.
        at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC when cross-exam completed.
    SecretScanFinding:
      type: object
      additionalProperties: false
      required: [path, rule]
      properties:
        path:
          type: string
          minLength: 1
        rule:
          type: string
          minLength: 1
          description: Detector name. The matched secret is not included.
        line:
          type: integer
          minimum: 1
    ApplyPlanResponse:
      type: object
      additionalProperties: false
      required: [plan, audit_id]
      properties:
        plan:
          $ref: "#/components/schemas/Plan"
        audit_id:
          $ref: "#/components/schemas/AuditID"
          description: Audit entry produced by this apply.
    ApproveRequest:
      type: object
      additionalProperties: false
      properties:
        comment:
          type: string
          minLength: 1
    RequestChangesRequest:
      type: object
      additionalProperties: false
      required: [comment]
      properties:
        comment:
          type: string
          minLength: 1
    BranchPlanRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          minLength: 1
          description: Why this branch exists.
    Agent:
      type: object
      additionalProperties: false
      required: [id, name, harness, status, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/AgentID"
        name:
          type: string
          minLength: 1
        harness:
          type: string
          minLength: 1
          description: Harness driver name. Stage 1 is claudecode.
        status:
          $ref: "#/components/schemas/AgentStatus"
        model:
          type: string
          minLength: 1
        tools:
          type: array
          items:
            type: string
            minLength: 1
          description: Tool names this agent may be offered. Policy still denies by default; this is not a grant.
        autonomy_tier:
          type: string
          minLength: 1
          description: Default autonomy tier for new runs of this agent. Unknown tiers deny by default.
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
    AgentPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        tools:
          type: array
          items:
            type: string
            minLength: 1
        autonomy_tier:
          type: string
          minLength: 1
          description: Explicit operator tier change. Stage 1 does not auto-promote.
    AgentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        next_cursor:
          type: string
          minLength: 1
    Lease:
      type: object
      additionalProperties: false
      required: [id, grant_id, scope_id, agent_id, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/LeaseID"
        grant_id:
          $ref: "#/components/schemas/GrantID"
        scope_id:
          $ref: "#/components/schemas/ScopeID"
        agent_id:
          $ref: "#/components/schemas/AgentID"
        expires_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC. A lease cannot outlive this window.
        minted_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
    LeaseList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Lease"
    Approval:
      type: object
      additionalProperties: false
      required: [id, kind, status, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ApprovalID"
        kind:
          type: string
          minLength: 1
          description: |
            Subject kind. Open string (same rule as RunEvent.type).
            Clients must tolerate unknown kinds. Deep-link via plan_id
            and run_id to the resource that accepts the decision.
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        plan_id:
          $ref: "#/components/schemas/PlanID"
        run_id:
          $ref: "#/components/schemas/RunID"
        summary:
          type: string
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
    ApprovalList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
        next_cursor:
          type: string
          minLength: 1
    MemoryEntry:
      type: object
      additionalProperties: false
      required: [id, kind, content, created_at]
      properties:
        id:
          $ref: "#/components/schemas/MemoryID"
        kind:
          $ref: "#/components/schemas/MemoryKind"
        ref_id:
          type: string
          minLength: 1
          description: Run id when kind is session, agent id when kind is agent.
        content:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
    MemoryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemoryEntry"
        next_cursor:
          type: string
          minLength: 1
    CreateMemoryRequest:
      type: object
      additionalProperties: false
      required: [kind, content]
      properties:
        kind:
          $ref: "#/components/schemas/MemoryKind"
        ref_id:
          type: string
          minLength: 1
          description: Required when kind is session or agent.
        content:
          type: string
          minLength: 1
    MemoryProposal:
      type: object
      additionalProperties: false
      required: [id, kind, content, status, created_at]
      properties:
        id:
          $ref: "#/components/schemas/MemoryProposalID"
        kind:
          $ref: "#/components/schemas/MemoryKind"
        ref_id:
          type: string
          minLength: 1
        run_id:
          $ref: "#/components/schemas/RunID"
          description: Run that proposed this memory, when it came from a run.
        content:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/MemoryProposalStatus"
        memory_id:
          $ref: "#/components/schemas/MemoryID"
          description: Set after accept, when an entry was written.
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
        reviewed_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
    MemoryProposalList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemoryProposal"
        next_cursor:
          type: string
          minLength: 1
    AuditRecord:
      type: object
      additionalProperties: false
      required: [id, action, resource_type, resource_id, signature, created_at]
      properties:
        id:
          $ref: "#/components/schemas/AuditID"
        action:
          type: string
          minLength: 1
          description: What happened (open string; clients must tolerate unknown actions).
        resource_type:
          $ref: "#/components/schemas/AuditResourceType"
        resource_id:
          type: string
          minLength: 1
        actor:
          type: string
          minLength: 1
          description: Local operator identity used when signing.
        target:
          type: string
          minLength: 1
          description: Resource the action applied to.
        plan_hash:
          type: string
          minLength: 1
          description: Canonical plan hash when the action is plan-scoped.
        precondition:
          type: string
        postcondition:
          type: string
        lease_id:
          $ref: "#/components/schemas/LeaseID"
        approver:
          type: string
          minLength: 1
        agent_id:
          $ref: "#/components/schemas/AgentID"
        run_id:
          $ref: "#/components/schemas/RunID"
        agent_pubkey:
          type: string
          minLength: 64
          maxLength: 64
          description: Hex-encoded BIP-340 x-only public key that produced signature.
        prev_hash:
          type: string
          description: Hex SHA-256 of the previous record (payload plus signature). Empty for genesis.
        hash:
          type: string
          minLength: 1
          description: Hex SHA-256 of this record's payload plus signature. The next row's prev_hash.
        signature:
          type: string
          minLength: 1
          description: secp256k1 Schnorr signature, hex-encoded (ADR-Z-0007). Not a credential.
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
    AuditList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditRecord"
        next_cursor:
          type: string
          minLength: 1
    AuditVerification:
      type: object
      additionalProperties: false
      required: [id, valid]
      properties:
        id:
          $ref: "#/components/schemas/AuditID"
        valid:
          type: boolean
        reason:
          type: string
          description: Set when valid is false.
    Checkpoint:
      type: object
      additionalProperties: false
      required: [id, run_id, created_at]
      properties:
        id:
          $ref: "#/components/schemas/CheckpointID"
        run_id:
          $ref: "#/components/schemas/RunID"
        label:
          type: string
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
    CheckpointList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Checkpoint"
        next_cursor:
          type: string
          minLength: 1
    CreateCheckpointRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          description: Optional operator label for this snapshot.
